<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার ও সার্চ সেকশন -->
    <header>
        <h1>AnimeStream</h1>
        <input type="text" id="searchInput" placeholder="Search anime...">
    </header>

    <!-- ক্যাটাগরি ফিল্টার বার -->
    <nav class="category-bar">
        <button class="cat-btn active" onclick="filterCategory('All')">All</button>
        <button class="cat-btn" onclick="filterCategory('Action')">Action</button>
        <button class="cat-btn" onclick="filterCategory('Romance')">Romance</button>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <main class="container">
        <!-- অ্যানিমে লিস্ট সাইডবার -->
        <div class="anime-list" id="animeList">
            <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে ডেটা লোড হবে -->
        </div>

        <!-- ভিডিও প্লেয়ার সেকশন -->
        <div class="player-section">
            <h2 id="currentTitle">Select an Anime to Watch</h2>
            <div class="video-container" id="videoContainer">
                <p>No video selected</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
