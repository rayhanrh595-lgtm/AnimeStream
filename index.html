<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার বা লোগো সেকশন -->
    <header>
        <h1>My Anime Stream</h1>
        <input type="text" id="searchInput" placeholder="Search anime...">
    </header>

    <!-- মেইন কন্টেন্ট: অ্যানিমে লিস্ট ও ভিডিও প্লেয়ার -->
    <main class="container">
        <!-- অ্যানিমে কার্টুন বা লিস্ট সেকশন -->
        <div class="anime-list" id="animeList">
            <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে অ্যানিমে কার্ডগুলো অটো আসবে -->
        </div>

        <!-- ভিডিও প্লেয়ার সেকশন -->
        <div class="player-section">
            <h2 id="currentTitle">Select an Anime to Watch</h2>
            <div class="video-container" id="videoContainer">
                <p>No video selected</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
